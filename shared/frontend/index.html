<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartBank</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Vendored so the showcase does not depend on network access. -->
    <script src="/js/htmx.min.js"></script>
</head>
<body>

<header class="app-header">
    <div class="app-shell shell-bar">
        <a class="brand" href="/"
           hx-get="/features/home.html" hx-target="#feature-view" hx-swap="innerHTML"
           hx-push-url="/">
            <span class="brand-mark">SB</span>
            SmartBank
        </a>

        <!--
          Single entry point: every feature is one htmx request away. Each nav
          item fetches a small same-origin fragment (/features/<key>.html) that
          embeds that student's frontend microservice, and swaps it into
          #feature-view without a full page load. hx-push-url keeps the
          browser back button and refresh working.
        -->
        <nav class="feature-nav" aria-label="Features"
             hx-target="#feature-view" hx-swap="innerHTML" hx-indicator="#nav-spinner">
            <button class="nav-item" data-feature="accounts" data-href="http://localhost:3001/"
                    hx-get="/features/accounts.html" hx-push-url="/?feature=accounts">Accounts</button>
            <button class="nav-item" data-feature="loans" data-href="http://localhost:3002/tabs/loans.html"
                    hx-get="/features/loans.html" hx-push-url="/?feature=loans">Loans</button>
            <button class="nav-item" data-feature="fraud" data-href="http://localhost:3003/tabs/normal.html"
                    hx-get="/features/fraud.html" hx-push-url="/?feature=fraud">Fraud Alerts</button>
            <button class="nav-item" data-feature="budgeting" data-href="http://localhost:3004/tabs/budgets.html"
                    hx-get="/features/budgeting.html" hx-push-url="/?feature=budgeting">Budgeting</button>
            <button class="nav-item" data-feature="transactions" data-href="http://localhost:3005/"
                    hx-get="/features/transactions.html" hx-push-url="/?feature=transactions">Transactions</button>
            <span id="nav-spinner" class="htmx-indicator spinner">loading&hellip;</span>
        </nav>
    </div>
</header>

<main class="app-shell">
    <!-- The landing content is loaded by htmx too, so the home page itself
         exercises the same request/swap path as every feature. -->
    <div id="feature-view"
         hx-get="/features/home.html"
         hx-trigger="load"
         hx-swap="innerHTML">
        <p class="empty">Loading SmartBank&hellip;</p>
    </div>
</main>

<script>
// Sibling services are addressed by port. Rewrite "localhost" to whatever host
// the browser actually used, so the shell keeps working when it is served from
// the demo VM instead of a developer machine. Runs on every htmx swap because
// the fragments carry the links.
function rewriteHosts(root) {
    const host = window.location.hostname;
    if (host === "localhost") return;
    root.querySelectorAll('[href*="//localhost:"], [src*="//localhost:"]').forEach((el) => {
        const attr = el.hasAttribute("src") ? "src" : "href";
        el.setAttribute(attr, el.getAttribute(attr).replace("//localhost:", `//${host}:`));
    });
}

// Highlight the nav item for whichever feature is on screen.
function markActive(feature) {
    document.querySelectorAll(".nav-item").forEach((b) => {
        b.classList.toggle("is-active", b.dataset.feature === feature);
    });
}

document.body.addEventListener("htmx:afterSwap", (event) => {
    if (event.detail.target.id !== "feature-view") return;
    rewriteHosts(event.detail.target);
    const view = event.detail.target.querySelector("[data-feature]");
    markActive(view ? view.dataset.feature : "");
    window.scrollTo({ top: 0 });
});

// Deep links and refresh: /?feature=budgeting loads that feature instead of home.
document.addEventListener("DOMContentLoaded", () => {
    const feature = new URLSearchParams(window.location.search).get("feature");
    const view = document.getElementById("feature-view");
    if (feature && /^[a-z-]+$/.test(feature)) {
        view.setAttribute("hx-get", `/features/${feature}.html`);
    }
});

// Browser back/forward: htmx restores from its history cache, but the first
// entry (the load-triggered one) has no cached fragment, so re-request it.
window.addEventListener("popstate", () => {
    const feature = new URLSearchParams(window.location.search).get("feature") || "home";
    htmx.ajax("GET", `/features/${feature}.html`, { target: "#feature-view", swap: "innerHTML" });
});

// Graceful degradation. This index.html is also mounted as the root page of
// some feature containers that serve css/ and js/ but not the features/
// fragments. If a fragment is missing there, fall back to a plain navigation
// to the feature's own URL, and render the landing grid inline so the page is
// never blank. Nothing here runs when the fragments are served normally.
const FEATURES = [
    ["accounts",     "Accounts &amp; Customers",          "Student 1 &middot; William Por",        "http://localhost:3001/"],
    ["loans",        "Loans &amp; Credit",                "Student 2 &middot; David Lee",          "http://localhost:3002/tabs/loans.html"],
    ["fraud",        "Fraud Alerts",                      "Student 3 &middot; Duc Minh Khoi Tran", "http://localhost:3003/tabs/normal.html"],
    ["budgeting",    "Budgeting &amp; Spending Insights", "Student 4 &middot; Cong Bao Nguyen",    "http://localhost:3004/tabs/budgets.html"],
    ["transactions", "Transactions",                      "Student 5 &middot; Aidan Lei",          "http://localhost:3005/"],
];

function inlineHome() {
    const cards = FEATURES.map(([key, title, owner, url]) =>
        `<a class="feature-card" href="${url}"><h3>${title}</h3><span class="owner">${owner}</span></a>`
    ).join("");
    return `<section class="card"><h2>SmartBank</h2>
        <p class="tagline">Choose a feature to open it.</p></section>
        <div class="feature-grid">${cards}</div>`;
}

document.body.addEventListener("htmx:responseError", (event) => {
    if (event.detail.target.id !== "feature-view") return;
    const href = event.detail.elt && event.detail.elt.dataset && event.detail.elt.dataset.href;
    if (href) {                      // a feature fragment is missing here: go to the feature directly
        window.location.assign(href.replace("//localhost:", `//${window.location.hostname}:`));
        return;
    }
    event.detail.target.innerHTML = inlineHome();   // the landing fragment is missing: draw it inline
    rewriteHosts(event.detail.target);
});
</script>

</body>
</html>
