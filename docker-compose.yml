# SmartBank - shared Docker Compose stack (Release 0).
#
# Starts every feature plus the shared home page as one application:
#
#   docker compose up --build -d            # all services, AI-Mode via Gemini
#   docker compose --profile local-llm up   # add a local Ollama runtime (fallback)
#   docker compose ps
#   docker compose down -v
#
# Put GEMINI_API_KEY in a .env file next to this file (see .env.example).
#
# Ports (host):  home 3000 | accounts 3001/5001/5011 | loans 3002/5002/5012 |
#                transactions 3005/5005/5015 | fraud 3003/5003/5013 | budgeting 3004/5004/5014
#
# Release 0 notes
# - Accounts and Transactions each ship as one image that runs their
#   tiers as processes.
# - Loans, Fraud and Budgeting each ship three images - database, backend/API
#   and frontend - built from their own Dockerfiles, all with the repo root
#   as build context.

x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
  GEMINI_REVIEW_MODEL: ${GEMINI_REVIEW_MODEL:-gemini-flash-lite-latest}
  OLLAMA_BASE_URL: http://ollama:11434/v1
  OLLAMA_API_KEY: ollama
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
  OLLAMA_REVIEW_MODEL: ${OLLAMA_REVIEW_MODEL:-llama3.1:8b}

services:

  # ---------------------------------------------------------------------
  # Shared home page (unified index.html + CSS theme + htmx)
  # ---------------------------------------------------------------------
  home:
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile
    image: smartbank-home:0.1
    container_name: smartbank-home
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Accounts & Customers (William) - one image: db 5011, api 5001, web 3001
  # ---------------------------------------------------------------------
  accounts:
    build:
      context: .
      dockerfile: services/accounts/Dockerfile
    image: smartbank-accounts:0.1
    container_name: accounts
    ports:
      - "3001:3001"
      - "5001:5001"
      - "5011:5011"
    environment:
      <<: *llm-env
      FLASK_OPEN_CHROME: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Loans & Credit (David) - three images: db 5012, api 5002, web 3002
  # ---------------------------------------------------------------------
  loans-database-service:
    build:
      context: .
      dockerfile: services/loans/database/Dockerfile
    image: smartbank-loans-db:0.1
    container_name: loans-database-service
    ports:
      - "5012:5012"
    volumes:
      - loans-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5012/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [smartbank]

  loans-service:
    build:
      context: .
      dockerfile: services/loans/backend/Dockerfile
    image: smartbank-loans-api:0.1
    container_name: loans-service
    ports:
      - "5002:5002"
    environment:
      <<: *llm-env
      DATABASE_SERVICE_URL: http://loans-database-service:5012
      ACCOUNTS_SERVICE_URL: http://accounts:5001
    depends_on:
      loans-database-service:
        condition: service_healthy
      accounts:
        condition: service_started
    restart: unless-stopped
    networks: [smartbank]

  loans-frontend-service:
    build:
      context: .
      dockerfile: services/loans/frontend/Dockerfile
    image: smartbank-loans-web:0.1
    container_name: loans-frontend-service
    ports:
      - "3002:80"
    depends_on: [loans-service]
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Transactions (Aidan) - one image: db 5015, api 5005, web 3005
  # ---------------------------------------------------------------------
  transactions:
    build:
      context: .
      dockerfile: services/transactions/Dockerfile
    image: smartbank-transactions:0.1
    container_name: transactions
    ports:
      - "3005:3005"
      - "5005:5005"
      - "5015:5015"
    environment:
      <<: *llm-env
      FLASK_OPEN_CHROME: "0"
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Fraud Alerts (Khoi) - three images: db 5013, api 5003, web 3003
  # ---------------------------------------------------------------------
  fraud-database-service:
    build:
      context: .
      dockerfile: services/fraud-alerts/database/Dockerfile
    image: smartbank-fraud-db:0.1
    container_name: fraud-database-service
    ports:
      - "5013:5013"
    volumes:
      - fraud-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5013/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [smartbank]

  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-alerts/backend/Dockerfile
    image: smartbank-fraud-api:0.1
    container_name: fraud-service
    ports:
      - "5003:5003"
    environment:
      <<: *llm-env
      FRAUD_DB_URL: http://fraud-database-service:5013
      ACCOUNTS_SERVICE_URL: http://accounts:5001
      TRANSACTIONS_SERVICE_URL: http://transactions:5005
      TRANSACTIONS_SOURCE: ${TRANSACTIONS_SOURCE:-seed}
    depends_on:
      fraud-database-service:
        condition: service_healthy
      accounts:
        condition: service_started
      transactions:
        condition: service_started
    restart: unless-stopped
    networks: [smartbank]

  fraud-frontend-service:
    build:
      context: .
      dockerfile: services/fraud-alerts/frontend/Dockerfile
    image: smartbank-fraud-web:0.1
    container_name: fraud-frontend-service
    ports:
      - "3003:80"
    depends_on: [fraud-service]
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Budgeting & Spending Insights (Bao) - three images: db 5014, api 5004, web 3004
  # ---------------------------------------------------------------------
  budgeting-database-service:
    build:
      context: .
      dockerfile: services/budgeting/database/Dockerfile
    image: smartbank-budgeting-db:0.1
    container_name: budgeting-database-service
    ports:
      - "5014:5014"
    volumes:
      - budgets-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5014/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [smartbank]

  budgeting-service:
    build:
      context: .
      dockerfile: services/budgeting/backend/Dockerfile
    image: smartbank-budgeting-api:0.1
    container_name: budgeting-service
    ports:
      - "5004:5004"
    environment:
      <<: *llm-env
      BUDGET_DB_URL: http://budgeting-database-service:5014
      ACCOUNTS_SERVICE_URL: http://accounts:5001
      TRANSACTIONS_SERVICE_URL: http://transactions:5005
      USE_MOCK_TRANSACTIONS: auto
    depends_on:
      budgeting-database-service:
        condition: service_healthy
      transactions:
        condition: service_started
    restart: unless-stopped
    networks: [smartbank]

  budgeting-frontend-service:
    build:
      context: .
      dockerfile: services/budgeting/frontend/Dockerfile
    image: smartbank-budgeting-web:0.1
    container_name: budgeting-frontend-service
    ports:
      - "3004:80"
    depends_on: [budgeting-service]
    restart: unless-stopped
    networks: [smartbank]

  # ---------------------------------------------------------------------
  # Optional local AI runtime (fallback): docker compose --profile local-llm up
  # then set LLM_PROVIDER=ollama in .env
  # ---------------------------------------------------------------------
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks: [smartbank]

networks:
  smartbank:
    name: smartbank-network

volumes:
  budgets-data:
  fraud-data:
  loans-data:
  ollama-models:
