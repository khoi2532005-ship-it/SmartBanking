<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transactions</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    pre { background:#f4f4f4; padding:10px; white-space: pre-wrap; }
    .row { display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
    .row > * { display:flex; flex-direction:column; }
    button { padding: 6px 12px; }
    input, select { padding: 6px; }
  </style>
</head>
<body>
  <h1>Transactions</h1>
  <p>This page calls the Transactions API and displays the results.</p>

  <div class="row">
    <div>
      <label for="account">Account ID</label>
      <input id="account" type="number" min="1" placeholder="1001" />
    </div>
    <div>
      <label for="customer">Customer ID</label>
      <input id="customer" type="number" min="1" placeholder="1" />
    </div>
    <div>
      <label for="type">Type</label>
      <select id="type">
        <option value="">Any</option>
        <option value="Deposit">Deposit</option>
        <option value="Withdrawal">Withdrawal</option>
        <option value="Transfer">Transfer</option>
      </select>
    </div>
    <button id="btn">Fetch transactions</button>
  </div>

  <h2>Create transaction</h2>
  <div class="row" style="margin-bottom: 12px;">
    <div>
      <label for="newAccountId">Account ID</label>
      <input id="newAccountId" type="number" min="1" value="1001" />
    </div>
    <div>
      <label for="newType">Type</label>
      <select id="newType">
        <option value="Withdrawal">Withdrawal</option>
        <option value="Deposit">Deposit</option>
        <option value="Transfer">Transfer</option>
      </select>
    </div>
    <div>
      <label for="newAmount">Amount</label>
      <input id="newAmount" type="number" step="0.01" value="25.50" />
    </div>
    <div>
      <label for="newCurrency">Currency</label>
      <input id="newCurrency" type="text" value="AUD" />
    </div>
    <div>
      <label for="newDate">Date</label>
      <input id="newDate" type="date" value="2026-09-09" />
    </div>
    <div>
      <label for="newDescription">Description</label>
      <input id="newDescription" type="text" value="Fresh food top-up" />
    </div>
    <button id="createBtn">Create transaction</button>
  </div>

  <h2>Result</h2>
  <pre id="out">(no data)</pre>

  <script>
    const API = `http://${window.location.hostname}:5005`;

    document.getElementById('btn').addEventListener('click', async () => {
      const account = document.getElementById('account').value.trim();
      const customer = document.getElementById('customer').value.trim();
      const type = document.getElementById('type').value;
      const params = new URLSearchParams();
      if (account) params.set('account_id', account);
      if (customer) params.set('customer_id', customer);
      if (type) params.set('type', type);

      const url = `${API}/api/transactions${params.toString() ? `?${params}` : ''}`;
      document.getElementById('out').textContent = 'Loading...';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const data = await res.json();
        document.getElementById('out').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('out').textContent = 'Error: ' + err;
      }
    });

    document.getElementById('createBtn').addEventListener('click', async () => {
      const payload = {
        account_id: Number(document.getElementById('newAccountId').value),
        amount: Number(document.getElementById('newAmount').value),
        currency: document.getElementById('newCurrency').value.trim() || 'AUD',
        type: document.getElementById('newType').value,
        description: document.getElementById('newDescription').value.trim() || null,
        date: document.getElementById('newDate').value
      };

      document.getElementById('out').textContent = 'Creating transaction...';

      try {
        const res = await fetch(`${API}/api/transactions`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const contentType = res.headers.get('content-type') || '';
        const data = contentType.includes('application/json') ? await res.json() : await res.text();

        if (!res.ok) {
          throw new Error(typeof data === 'string' ? data : JSON.stringify(data, null, 2));
        }

        document.getElementById('out').textContent = JSON.stringify(data, null, 2);
        document.getElementById('btn').click();
      } catch (err) {
        document.getElementById('out').textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
