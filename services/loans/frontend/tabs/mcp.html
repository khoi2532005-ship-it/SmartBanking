<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loans MCP Mode - SmartBank</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Vendored locally so the demo does not depend on network access. -->
    <script src="/js/htmx.min.js"></script>
    <style>
        body { background: #fff; }
        .app-shell { max-width: none; padding: 1rem; }
        .card { margin-bottom: 1.5rem; }
        /* Pinned tabs: keep the view switcher visible while the page scrolls. */
        .tab-strip {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            padding: 0.6rem 0;
            margin: 0 0 1rem;
        }
        .insight-card h3 { margin: 0 0 0.5rem; font-size: 0.98rem; }
        .insight-card p { margin: 0 0 0.6rem; }
    </style>
</head>
<body>

<main class="app-shell">

    <nav class="feature-nav tab-strip" aria-label="Loans views">
        <a class="nav-item" href="/tabs/loans.html">Normal</a>
        <a class="nav-item" href="/tabs/ai-mode.html">AI Mode</a>
        <a class="nav-item is-active" href="/tabs/mcp.html" aria-current="page">MCP</a>
        <a class="nav-item" href="/tabs/rag.html">RAG</a>
        <a class="nav-item" href="/tabs/multi-agent.html">Multi-Agent</a>
    </nav>

    <section class="card">
        <h2>MCP Mode</h2>
        <div class="feature-toggle-row">
            <label class="toggle-switch" for="mcp-mode-toggle">
                <input id="mcp-mode-toggle" type="checkbox" checked>
                <span class="toggle-label">MCP Enabled</span>
            </label>
            <span id="mcp-mode-state" class="feature-state feature-on">ON</span>
        </div>

        <p>MCP: List Customer Loans</p>
        <form class="row" hx-post="/ui/mcp/loans-list" hx-target="#mcp-result"
              hx-swap="innerHTML" hx-indicator="#mcp-spinner">
            <div><label for="mcp_customer_id">Customer ID</label>
                <input id="mcp_customer_id" name="customer_id" type="number" min="1" value="1" required></div>
            <div><label for="mcp_status">Status (optional)</label>
                <select id="mcp_status" name="status"><option value="">Any</option>
                    <option>PENDING</option><option>APPROVED</option>
                    <option>REJECTED</option><option>CANCELLED</option></select></div>
            <div><button type="submit" class="btn-ai">Run Tool</button></div>
            <div><span id="mcp-spinner" class="htmx-indicator spinner">
                Running MCP loans_list&hellip;</span></div>
        </form>

        <div id="mcp-result" class="panel panel-mcp">
            <p class="empty">MCP tool responses will appear here.</p>
        </div>
    </section>

</main>

<script>
// The frontend is a separate microservice, so HTMX requests must be sent to
// the loans backend/API service rather than to this static host. The toggle
// is carried on every request as the X-MCP-Mode header the backend checks
// alongside MCP_ENABLED.
const LOANS_API = window.LOANS_API || `http://${window.location.hostname}:5002`;
const MCP_STORAGE_KEY = "loans_mcp_mode_enabled";

const mcpToggle = document.getElementById("mcp-mode-toggle");
const mcpState = document.getElementById("mcp-mode-state");
const mcpResult = document.getElementById("mcp-result");

function renderMcpState() {
    const on = mcpToggle.checked;
    mcpState.textContent = on ? "ON" : "OFF";
    mcpState.classList.toggle("feature-on", on);
    mcpState.classList.toggle("feature-off", !on);
}

function renderMcpDisabled() {
    mcpResult.innerHTML =
        '<p class="alert alert-warn">MCP Mode is OFF. Enable MCP Mode to run MCP tools.</p>';
}

mcpToggle.addEventListener("change", () => {
    localStorage.setItem(MCP_STORAGE_KEY, String(mcpToggle.checked));
    renderMcpState();
    if (!mcpToggle.checked) renderMcpDisabled();
});

const persisted = localStorage.getItem(MCP_STORAGE_KEY);
mcpToggle.checked = persisted === null ? true : persisted === "true";
renderMcpState();
if (!mcpToggle.checked) renderMcpDisabled();

document.body.addEventListener("htmx:configRequest", (event) => {
    if (event.detail.path.startsWith("/ui/")) {
        event.detail.path = LOANS_API + event.detail.path;
        event.detail.headers["X-MCP-Mode"] = mcpToggle.checked ? "on" : "off";
    }
});

// Surface network/server failures instead of leaving the panel blank.
document.body.addEventListener("htmx:responseError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Request failed (HTTP ' +
        event.detail.xhr.status + "). Is the loans API running on " +
        LOANS_API + "?</p>";
});

document.body.addEventListener("htmx:sendError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Could not reach the loans API at ' +
        LOANS_API + ". Start loans-service and try again.</p>";
});
</script>

</body>
</html>
