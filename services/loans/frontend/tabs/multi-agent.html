<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loans Multi-Agent Mode - SmartBank</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Vendored locally so the demo does not depend on network access. -->
    <script src="/js/htmx.min.js"></script>
    <style>
        body { background: #fff; }
        .app-shell { max-width: none; padding: 1rem; }
        .card { margin-bottom: 1.5rem; }
        .tab-strip {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            padding: 0.6rem 0;
            margin: 0 0 1rem;
        }
        .grow { flex: 1 1 320px; }
        .status-line { display: flex; gap: 0.5rem; align-items: center;
                       flex-wrap: wrap; margin: 0.25rem 0 0.9rem;
                       font-size: 0.87rem; color: var(--ink-soft); }
        .status-line .status-text { flex: 1 1 240px; min-width: 0; }
        .status-line .badge { margin-left: 0; }
        .status-line .btn-small { margin-left: auto; }
        .insight-card .history-head { display: flex; gap: 0.5rem; align-items: center;
                                      margin-bottom: 0.3rem; flex-wrap: wrap; }
        .ma-section { border-top: 1px solid var(--line-soft); padding-top: 0.5rem; margin-top: 0.6rem; }
        .ma-section h4 { margin: 0 0 0.25rem; }
        .ma-section ul { margin: 0.2rem 0 0.4rem; padding-left: 1.2rem; }
        .ma-final { border-left: 4px solid var(--ok); padding-left: 0.75rem; }
        .ma-decision .row { align-items: flex-start; }
        .ma-decision input, .ma-decision textarea { width: 100%; }
        .ma-decision .form-actions { display: flex; gap: 0.5rem; align-items: center;
                                     flex-wrap: wrap; margin-top: 0.5rem; }
        .ma-message:empty { display: none; }
        .ma-message .alert { margin: 0.4rem 0 0; }
        .ma-history-title { margin: 1rem 0 0.4rem; font-size: 0.95rem; }
        .chip-btn { border: 1px solid transparent; cursor: pointer; font: inherit;
                    font-size: 0.78rem; font-weight: 600; line-height: 1.4; }
        .chip-btn:hover { background: var(--brand-tint); border-color: var(--brand);
                          color: var(--brand-dark); }
        .insight-history { list-style: none; padding: 0; margin: 0.4rem 0; }
        .insight-history li { border-top: 1px solid var(--line-soft); padding: 0.4rem 0; }
        .insight-history li:first-child { border-top: 0; }
        td pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.8rem; margin: 0; }
    </style>
</head>
<body>

<main class="app-shell">

    <nav class="feature-nav tab-strip" aria-label="Loans views">
        <a class="nav-item" href="/tabs/loans.html">Normal</a>
        <a class="nav-item" href="/tabs/ai-mode.html">AI Mode</a>
        <a class="nav-item" href="/tabs/mcp.html">MCP</a>
        <a class="nav-item" href="/tabs/rag.html">RAG</a>
        <a class="nav-item is-active" href="/tabs/multi-agent.html" aria-current="page">Multi-Agent</a>
    </nav>

    <section class="card">
        <h2>Multi-Agent Mode</h2>
        <p class="muted">Run planner, worker, and reviewer agents in a coordinated workflow.</p>

        <p class="status-line">
            <span id="ma-status" class="status-text"
                  hx-get="/ui/multi-agent/status" hx-trigger="load" hx-swap="innerHTML">
                <span class="spinner">Checking...</span>
            </span>
            <button type="button" class="btn btn-secondary btn-small"
                    hx-get="/ui/multi-agent/status" hx-target="#ma-status"
                    hx-swap="innerHTML">Re-check</button>
        </p>

        <form class="row" hx-post="/ui/multi-agent/workflows" hx-target="#ma-panel"
              hx-swap="innerHTML" hx-indicator="#ma-spinner"
              hx-disabled-elt="find button[type=submit]">
            <div class="grow">
                <label for="workflow-request">User Request</label>
                <input id="workflow-request" name="request" list="workflow-request-samples" required
                       placeholder="Example: Assess eligibility for a personal loan and explain the credit factors.">
                <datalist id="workflow-request-samples">
                    <option value="Assess my eligibility for a $15,000 personal loan with a 36-month term and $4,200 monthly income. Explain the key factors."></option>
                    <option value="Compare monthly repayments and total interest for a $20,000 loan over 36 versus 60 months at 8% annual interest."></option>
                    <option value="Explain how credit score, income, and existing debt can affect loan approval, and suggest ways to improve my creditworthiness."></option>
                </datalist>
            </div>
            <div><label for="ma_customer_id">Customer</label>
                <input id="ma_customer_id" name="customer_id" type="number" min="1" value="1"></div>
            <div><button type="submit" class="btn-ai">Run Workflow</button></div>
            <div><span id="ma-spinner" class="htmx-indicator spinner">Starting...</span></div>
        </form>

        <div class="chips">
            Try:
            <button type="button" class="chip chip-btn"
                    data-request="Assess my eligibility for a $15,000 personal loan with a 36-month term and $4,200 monthly income. Explain the key factors.">Eligibility</button>
            <button type="button" class="chip chip-btn"
                    data-request="Compare monthly repayments and total interest for a $20,000 loan over 36 versus 60 months at 8% annual interest.">Compare terms</button>
            <button type="button" class="chip chip-btn"
                    data-request="Explain how credit score, income, and existing debt can affect loan approval, and suggest ways to improve my creditworthiness.">Credit factors</button>
        </div>

        <div class="row">
            <div><button type="button" class="btn btn-secondary"
                         hx-get="/ui/multi-agent/workflows/last" hx-target="#ma-panel"
                         hx-swap="innerHTML">Get Latest Workflow Status</button></div>
        </div>

        <div id="ma-panel" class="panel panel-mcp">
            <p class="empty">Multi-agent workflow results will appear here.</p>
        </div>

        <h3 class="ma-history-title">History</h3>
        <div id="ma-history" class="panel"
             hx-get="/ui/multi-agent/history"
             hx-trigger="load, ma-started from:body, ma-updated from:body, ma-decided from:body"
             hx-swap="innerHTML">
            <p class="empty">Loading...</p>
        </div>
    </section>

</main>

<script>
const LOANS_API = window.LOANS_API || `http://${window.location.hostname}:5002`;

document.body.addEventListener("htmx:configRequest", (event) => {
    if (event.detail.path.startsWith("/ui/")) {
        event.detail.path = LOANS_API + event.detail.path;
    }
});

document.body.addEventListener("click", (event) => {
    const chip = event.target.closest(".chip-btn");
    if (!chip) return;
    document.getElementById("workflow-request").value = chip.dataset.request;
    document.getElementById("workflow-request").focus();
});

document.body.addEventListener("htmx:responseError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Request failed (HTTP ' +
        event.detail.xhr.status + "). Is the loans API running on " +
        LOANS_API + "?</p>";
});

document.body.addEventListener("htmx:sendError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Could not reach the loans API at ' +
        LOANS_API + ". Start loans-service and try again.</p>";
});
</script>

</body>
</html>
