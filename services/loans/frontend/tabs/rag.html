<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loans RAG Mode - SmartBank</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Vendored locally so the demo does not depend on network access. -->
    <script src="/js/htmx.min.js"></script>
    <style>
        body { background: #fff; }
        .app-shell { max-width: none; padding: 1rem; }
        .card { margin-bottom: 1.5rem; }
        /* Pinned tabs: keep the view switcher visible while the page scrolls. */
        .tab-strip {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #fff;
            padding: 0.6rem 0;
            margin: 0 0 1rem;
        }
        .insight-card h3 { margin: 0 0 0.5rem; font-size: 0.98rem; }
        .insight-card h4 { margin: 0.7rem 0 0.2rem; font-size: 0.78rem;
                           text-transform: uppercase; letter-spacing: 0.04em; }
        .insight-card p { margin: 0 0 0.6rem; }
        td pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.8rem; margin: 0; max-width: 380px; }
        .history-head { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.3rem; flex-wrap: wrap; }
        .insight-history { list-style: none; padding: 0; margin: 0.4rem 0; }
        .insight-history li { border-top: 1px solid var(--line-soft); padding: 0.4rem 0; }
        .insight-history li:first-child { border-top: 0; }
    </style>
</head>
<body>

<main class="app-shell">

    <nav class="feature-nav tab-strip" aria-label="Loans views">
        <a class="nav-item" href="/tabs/loans.html">Normal</a>
        <a class="nav-item" href="/tabs/ai-mode.html">AI Mode</a>
        <a class="nav-item" href="/tabs/mcp.html">MCP</a>
        <a class="nav-item is-active" href="/tabs/rag.html" aria-current="page">RAG</a>
        <a class="nav-item" href="/tabs/multi-agent.html">Multi-Agent</a>
    </nav>

    <section class="card">
        <h2>RAG Mode</h2>
        <p class="muted">Inspect retrieved evidence or get a grounded answer with
        citations from the approved SmartBank corpus.</p>

        <div class="feature-toggle-row">
            <label class="toggle-switch" for="rag-mode-toggle">
                <input id="rag-mode-toggle" type="checkbox" checked>
                <span class="toggle-label">RAG Enabled</span>
            </label>
            <span id="rag-mode-state" class="feature-state feature-on">ON</span>
        </div>

        <form class="stack-form" hx-post="/ui/rag/retrieve" hx-target="#rag-result"
              hx-swap="innerHTML" hx-indicator="#rag-spinner">
            <label for="rag-retrieve-query">Query</label>
            <input id="rag-retrieve-query" name="query" required placeholder="Example: loan eligibility checks">
            <p class="rag-helper">Hint: use short retrieval phrases.</p>
            <button type="submit" class="rag-action">Retrieve Context</button>
        </form>

        <form class="stack-form" hx-post="/ui/rag/answer" hx-target="#rag-result"
              hx-swap="innerHTML" hx-indicator="#rag-spinner">
            <label for="rag-answer-query">Question</label>
            <input id="rag-answer-query" name="query" required placeholder="Example: What are the loan eligibility checks?">
            <p class="rag-helper">Hint: ask a full question for grounded answers.</p>
            <button type="submit" class="rag-action">Answer with Citations</button>
        </form>

        <div><span id="rag-spinner" class="htmx-indicator spinner">Asking the RAG server&hellip;</span></div>

        <div id="rag-result" class="panel panel-mcp">
            <p class="empty">RAG responses will appear here.</p>
        </div>
    </section>

</main>

<script>
// The frontend is a separate microservice, so HTMX requests must be sent to
// the loans backend/API service rather than to this static host. The toggle
// is carried on every request as the X-RAG-Mode header the backend checks
// alongside RAG_ENABLED.
const LOANS_API = window.LOANS_API || `http://${window.location.hostname}:5002`;
const RAG_STORAGE_KEY = "loans_rag_mode_enabled";

const ragToggle = document.getElementById("rag-mode-toggle");
const ragState = document.getElementById("rag-mode-state");
const ragResult = document.getElementById("rag-result");

function renderRagState() {
    const on = ragToggle.checked;
    ragState.textContent = on ? "ON" : "OFF";
    ragState.classList.toggle("feature-on", on);
    ragState.classList.toggle("feature-off", !on);
}

function renderRagDisabled() {
    ragResult.innerHTML =
        '<p class="alert alert-warn">RAG Mode is OFF. Enable RAG Mode to run RAG tools.</p>';
}

ragToggle.addEventListener("change", () => {
    localStorage.setItem(RAG_STORAGE_KEY, String(ragToggle.checked));
    renderRagState();
    if (!ragToggle.checked) renderRagDisabled();
});

const persisted = localStorage.getItem(RAG_STORAGE_KEY);
ragToggle.checked = persisted === null ? true : persisted === "true";
renderRagState();
if (!ragToggle.checked) renderRagDisabled();

document.body.addEventListener("htmx:configRequest", (event) => {
    if (event.detail.path.startsWith("/ui/")) {
        event.detail.path = LOANS_API + event.detail.path;
        event.detail.headers["X-RAG-Mode"] = ragToggle.checked ? "on" : "off";
    }
});

// Surface network/server failures instead of leaving the panel blank.
document.body.addEventListener("htmx:responseError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Request failed (HTTP ' +
        event.detail.xhr.status + "). Is the loans API running on " +
        LOANS_API + "?</p>";
});

document.body.addEventListener("htmx:sendError", (event) => {
    event.detail.target.innerHTML =
        '<p class="alert alert-error">Could not reach the loans API at ' +
        LOANS_API + ". Start loans-service and try again.</p>";
});
</script>

</body>
</html>
