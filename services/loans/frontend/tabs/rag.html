<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loans Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { margin: 0; min-height: auto; background: transparent; font-family: system-ui, sans-serif; }
        .app-shell { max-width: none; padding: 1rem; }
        .card { margin-bottom: 1.5rem; }
        table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; font-size: 0.85rem; }
        th, td { border: 1px solid #d5dbe3; padding: 4px 8px; text-align: left; }
        th { background: #f0f3f7; cursor: pointer; }
        /* Long unbroken names and explanations wrap instead of widening the page. */
        td { overflow-wrap: anywhere; }
        .table-wrap { overflow-x: auto; }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
        .row > div { display: flex; flex-direction: column; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.8rem; }
        .is-hidden { display: none; }
        .panel { border: 1px solid #d5dbe3; border-radius: 6px; padding: 0.75rem; margin-top: 0.5rem; background: #fafbfc; }
        .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; color: #fff; }
        .sev-high { background: #c0392b; }
        .sev-medium { background: #d68910; }
        .sev-low { background: #7f8c8d; }
        button { cursor: pointer; }
        /* Tab strip linking the Normal and AI Mode views. */
        .tab-strip { margin: 0 0 1rem; }
        .tab-strip .nav-item { text-decoration: none; border-radius: var(--radius-small); }
    </style>
</head>
<body>
<main class="app-shell">
    <section class="card">
        <h2>RAG Mode</h2>
        <p>Inspect retrieved evidence or get a grounded answer with citations from the approved SmartBank corpus.</p>

        <div class="feature-toggle-row">
            <label class="toggle-switch" for="rag-mode-toggle">
                <input id="rag-mode-toggle" type="checkbox" checked>
                <span class="toggle-label">RAG Enabled</span>
            </label>
            <span id="rag-mode-state" class="feature-state feature-on">ON</span>
        </div>

        <form id="rag-retrieve-form" class="stack-form">
            <label for="rag-retrieve-query">Query</label>
            <input id="rag-retrieve-query" name="query" required placeholder="Example: loan eligibility checks">
            <p class="rag-helper">Hint: use short retrieval phrases.</p>
            <button type="submit" class="rag-action">Retrieve Context</button>
        </form>

        <form id="rag-answer-form" class="stack-form">
            <label for="rag-answer-query">Question</label>
            <input id="rag-answer-query" name="query" required placeholder="Example: What are the loan eligibility checks?">
            <p class="rag-helper">Hint: ask a full question for grounded answers.</p>
            <button type="submit" class="rag-action">Answer with Citations</button>
        </form>

        <div id="rag-result" class="panel panel-mcp">RAG responses will appear here.</div>
    </section>
</main>
<script src="/loans-js/rag.js"></script>
</body>
</html>
