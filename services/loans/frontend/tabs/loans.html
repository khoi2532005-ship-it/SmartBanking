<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loans Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        pre { white-space: pre-wrap; font-size: 0.8rem; }
        h2 { padding-top: 1rem; }
    </style>
</head>
<body>
<header class="app-header">
    <div class="app-shell">
        <a class="brand" href="/">
            <span class="brand-mark">SB</span>
            SmartBank
        </a>
    </div>
</header>

<main class="app-shell">
    <section class="card">
        <h2>Submit Loan Application</h2>
        <form id="apply-form" class="row">
            <div><label for="customer_id">Customer ID</label>
                <input id="customer_id" name="customer_id" type="number" min="1" placeholder="101" required></div>
            <div><label for="loan_type">Loan Type</label>
                <select id="loan_type" name="loan_type">
                    <option>PERSONAL</option><option>AUTO</option><option>EDUCATION</option>
                    <option>HOME</option><option>BUSINESS</option>
                </select></div>
            <div><label for="requested_amount">Requested Amount</label>
                <input id="requested_amount" name="requested_amount" type="number" min="100" step="0.01" placeholder="15000"></div>
            <div><label for="term_months">Term (months)</label>
                <input id="term_months" name="term_months" type="number" min="6" placeholder="36"></div>
            <div><label for="monthly_income">Monthly Income</label>
                <input id="monthly_income" name="monthly_income" type="number" min="0" step="0.01" placeholder="4200"></div>
            <div style="flex-basis: 100%;"><label for="loan_purpose">Purpose</label>
                <input id="loan_purpose" name="loan_purpose" type="text" placeholder="Debt consolidation"></div>
            <button type="submit">Submit Application</button>
        </form>
        <div id="apply-result" class="panel is-hidden"></div>

        <h2>Search &amp; Filter Loan Applications</h2>
        <form id="search-form" class="row">
            <div><label for="q">Free text</label>
                <input id="q" name="q" type="text" placeholder="id, customer, purpose..."></div>
            <div><label for="f_status">Status</label>
                <select id="f_status"><option value="">Any</option>
                    <option>PENDING</option><option>APPROVED</option>
                    <option>REJECTED</option><option>CANCELLED</option></select></div>
            <div><label for="f_loan_type">Type</label>
                <select id="f_loan_type"><option value="">Any</option>
                    <option>PERSONAL</option><option>AUTO</option><option>EDUCATION</option>
                    <option>HOME</option><option>BUSINESS</option></select></div>
            <button type="submit">Search Loans</button>
        </form>
        <div id="loans-result" class="panel is-hidden"></div>

        <h2>Loan Details &amp; Repayment Schedule</h2>
        <form id="detail-form" class="row">
            <div><label for="detail_id">Loan ID</label>
                <input id="detail_id" type="number" min="1" placeholder="1"></div>
            <button type="submit">View Details</button>
            <button type="button" id="eligibility-btn">Check Eligibility</button>
            <button type="button" id="approve-btn">Approve</button>
            <button type="button" id="reject-btn">Reject</button>
            <button type="button" id="delete-btn">Delete</button>
        </form>
        <div id="detail-result" class="panel is-hidden"></div>

        <h2>Update Repayment</h2>
        <form id="repay-form" class="row">
            <div><label for="repay_id">Repayment ID</label>
                <input id="repay_id" type="number" min="1" placeholder="3"></div>
            <div><label for="amount_paid">Amount Paid</label>
                <input id="amount_paid" type="number" min="0" step="0.01" placeholder="474.53"></div>
            <div><label for="payment_status">Status</label>
                <select id="payment_status"><option value="">Auto</option>
                    <option>UPCOMING</option><option>PARTIAL</option><option>PAID</option></select></div>
            <button type="submit">Update Payment</button>
        </form>
        <div id="repay-result" class="panel is-hidden"></div>

        <h2>All Repayments / Upcoming</h2>
        <form class="row">
            <button type="button" id="all-repayments-btn">All Repayments</button>
            <button type="button" id="upcoming-btn">Upcoming (30 days)</button>
        </form>
        <div id="repayments-result" class="panel is-hidden"></div>
    </section>

    <section class="card">
        <h2>AI Explanations for a Loan</h2>
        <form id="loan-ai-form" class="row">
            <div><label for="ai_loan_id">Loan ID</label>
                <input id="ai_loan_id" type="number" min="1" placeholder="4"></div>
            <button type="button" id="explain-eligibility-btn">Explain Eligibility</button>
            <button type="button" id="explain-decision-btn">Explain Decision</button>
            <button type="button" id="explain-repayments-btn">Explain Repayments</button>
        </form>
        <div id="explanation-result" class="panel is-hidden"></div>

        <h2>Compare Repayment Options &amp; Get a Recommendation</h2>
        <form id="compare-form" class="row">
            <div><label for="cmp_loan_id">Existing Loan ID (optional)</label>
                <input id="cmp_loan_id" type="number" min="1" placeholder="1"></div>
            <div><label for="cmp_amount">Amount (if no loan ID)</label>
                <input id="cmp_amount" type="number" min="100" step="0.01" placeholder="15000"></div>
            <div><label for="cmp_rate">Interest rate %</label>
                <input id="cmp_rate" type="number" min="0" step="0.1" placeholder="8.5"></div>
            <div><label for="cmp_income">Monthly income</label>
                <input id="cmp_income" type="number" min="0" step="0.01" placeholder="4200"></div>
            <div><label for="cmp_terms">Terms (comma separated)</label>
                <input id="cmp_terms" type="text" placeholder="12,24,36,48,60"></div>
            <button type="submit">Compare Options</button>
        </form>
        <div id="compare-result" class="panel is-hidden"></div>

        <p style="font-size: 0.8rem;">
            (<code>Gemini 2.5 Flash</code>). Make sure Gemini is running.
        </p>
    </section>
</main>

<script>
const API = "http://localhost:5002";

async function api(path, options = {}) {
    options.headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    const response = await fetch(`${API}${path}`, options);
    const body = await response.json().catch(() => ({}));
    return { ok: response.ok, status: response.status, body };
}

function show(panelId, content) {
    const panel = document.getElementById(panelId);
    panel.classList.remove("is-hidden");
    panel.innerHTML = content;
}

function errorBox(error) {
    return `<p>Request failed.</p><pre>${error}</pre>`;
}

function loansTable(loans) {
    if (!Array.isArray(loans) || !loans.length) return "<p>No loan applications found.</p>";
    const rows = loans.map((l) => `
        <tr>
            <td>${l.loan_id}</td><td>${l.customer_id}</td><td>${l.loan_type}</td>
            <td>$${Number(l.requested_amount).toLocaleString()}</td>
            <td>${l.status}</td><td>${l.interest_rate ?? "-"}</td>
            <td>${l.approved_amount ? "$" + Number(l.approved_amount).toLocaleString() : "-"}</td>
            <td>${String(l.application_date).slice(0, 10)}</td>
        </tr>`).join("");
    return `<table><tr><th>ID</th><th>Customer</th><th>Type</th><th>Requested</th>
        <th>Status</th><th>Rate %</th><th>Approved</th><th>Date</th></tr>${rows}</table>`;
}

function repaymentsTable(repayments) {
    if (!Array.isArray(repayments) || !repayments.length) return "<p>No repayments found.</p>";
    const rows = repayments.map((r) => `
        <tr>
            <td>${r.repayment_id}</td><td>${r.loan_id}</td>
            <td>${String(r.due_date).slice(0, 10)}</td>
            <td>$${Number(r.payment_amount).toFixed(2)}</td>
            <td>$${Number(r.principal_amount).toFixed(2)}</td>
            <td>$${Number(r.interest_amount).toFixed(2)}</td>
            <td>$${Number(r.amount_paid).toFixed(2)}</td>
            <td>${r.payment_status}</td>
        </tr>`).join("");
    return `<table><tr><th>ID</th><th>Loan</th><th>Due</th><th>Payment</th><th>Principal</th>
        <th>Interest</th><th>Paid</th><th>Status</th></tr>${rows}</table>`;
}

document.getElementById("apply-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.target;
    const payload = {};
    ["customer_id", "requested_amount", "term_months", "monthly_income", "loan_purpose"].forEach((name) => {
        if (form.elements[name].value !== "") payload[name] = form.elements[name].value;
    });
    payload.loan_type = form.elements.loan_type.value;
    try {
        const result = await api("/api/loans", { method: "POST", body: JSON.stringify(payload) });
        if (result.ok) {
            const e = result.body.eligibility;
            show("apply-result",
                `<p><b>Application #${result.body.loan.loan_id} submitted (PENDING).</b><br>
                 Eligible now: ${e.eligible ? "Yes" : "No"} |
                 Est. payment: $${e.estimated_monthly_payment ?? "-"} @ ${e.proposed_interest_rate ?? "-"}%</p>
                 <ul>${e.checks.map((c) => `<li>${c.passed ? "PASS" : "FAIL"} - ${c.detail}</li>`).join("")}</ul>`);
        } else show("apply-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("apply-result", errorBox(error)); }
});

document.getElementById("search-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const params = new URLSearchParams();
    if (document.getElementById("q").value) params.set("q", document.getElementById("q").value);
    if (document.getElementById("f_status").value) params.set("status", document.getElementById("f_status").value);
    if (document.getElementById("f_loan_type").value) params.set("loan_type", document.getElementById("f_loan_type").value);
    try {
        const result = await api(`/api/loans?${params}`);
        result.ok ? show("loans-result", loansTable(result.body))
                  : show("loans-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("loans-result", errorBox(error)); }
});

const detailIdInput = document.getElementById("detail_id");

async function viewDetails() {
    try {
        const result = await api(`/api/loans/${detailIdInput.value}`);
        if (!result.ok) return show("detail-result", `<p>Error: ${result.body.error || result.status}</p>`);
        const l = result.body;
        show("detail-result",
            `<p><b>Loan #${l.loan_id}</b> - ${l.loan_type} - <b>${l.status}</b><br>
             Customer ${l.customer_id} | Requested $${Number(l.requested_amount).toLocaleString()} |
             Approved ${l.approved_amount ? "$" + Number(l.approved_amount).toLocaleString() : "-"} |
             Rate ${l.interest_rate ?? "-"}% | Term ${l.term_months ?? "-"} months<br>
             Purpose: ${l.loan_purpose} | Applied: ${String(l.application_date).slice(0, 10)}</p>
             ${repaymentsTable(l.repayments)}`);
    } catch (error) { show("detail-result", errorBox(error)); }
}

document.getElementById("detail-form").addEventListener("submit", (e) => { e.preventDefault(); viewDetails(); });

async function decision(action) {
    try {
        const result = await api(`/api/loans/${detailIdInput.value}/decision`, {
            method: "POST", body: JSON.stringify({ action }),
        });
        if (result.ok) {
            show("detail-result",
                `<p><b>${action === "APPROVE" ? "Approved" : "Rejected"}.</b> ` +
                (action === "APPROVE"
                    ? `${result.body.repayments_created} repayments created, first due ${result.body.first_due_date}, monthly $${result.body.monthly_payment}.`
                    : "") + "</p>");
            viewDetails();
        } else show("detail-result", `<p>Error: ${JSON.stringify(result.body)}</p>`);
    } catch (error) { show("detail-result", errorBox(error)); }
}

document.getElementById("eligibility-btn").addEventListener("click", async () => {
    try {
        const result = await api(`/api/loans/${detailIdInput.value}/eligibility`);
        const e = result.body.eligibility;
        result.ok ? show("detail-result",
            `<p><b>Eligible: ${e.eligible ? "Yes" : "No"}</b> | Rate ${e.proposed_interest_rate ?? "-"}% |
             Term ${e.proposed_term_months ?? "-"} mo | Payment $${e.estimated_monthly_payment ?? "-"}</p>
             <ul>${e.checks.map((c) => `<li>${c.passed ? "PASS" : "FAIL"} - ${c.detail}</li>`).join("")}</ul>`)
                  : show("detail-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("detail-result", errorBox(error)); }
});
document.getElementById("approve-btn").addEventListener("click", () => decision("APPROVE"));
document.getElementById("reject-btn").addEventListener("click", () => decision("REJECT"));

document.getElementById("delete-btn").addEventListener("click", async () => {
    try {
        const result = await api(`/api/loans/${detailIdInput.value}`, { method: "DELETE" });
        result.ok ? show("detail-result", `<p>Deleted loan ${detailIdInput.value} and its repayments.</p>`)
                  : show("detail-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("detail-result", errorBox(error)); }
});

document.getElementById("repay-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {};
    if (document.getElementById("amount_paid").value !== "")
        payload.amount_paid = document.getElementById("amount_paid").value;
    if (document.getElementById("payment_status").value)
        payload.payment_status = document.getElementById("payment_status").value;
    try {
        const result = await api(`/api/repayments/${document.getElementById("repay_id").value}`, {
            method: "PUT", body: JSON.stringify(payload),
        });
        if (result.ok) {
            const r = result.body;
            show("repay-result",
                `<p>Updated repayment #${r.repayment_id}: paid $${Number(r.amount_paid).toFixed(2)}
                 of $${Number(r.payment_amount).toFixed(2)} - <b>${r.payment_status}</b></p>`);
        } else show("repay-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("repay-result", errorBox(error)); }
});

document.getElementById("all-repayments-btn").addEventListener("click", async () => {
    try {
        const result = await api("/api/repayments");
        result.ok ? show("repayments-result", repaymentsTable(result.body))
                  : show("repayments-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("repayments-result", errorBox(error)); }
});

document.getElementById("upcoming-btn").addEventListener("click", async () => {
    try {
        const result = await api("/api/repayments/upcoming?days=30");
        result.ok ? show("repayments-result", repaymentsTable(result.body))
                  : show("repayments-result", `<p>Error: ${result.body.error || result.status}</p>`);
    } catch (error) { show("repayments-result", errorBox(error)); }
});

function explain(kind) {
    const loanId = document.getElementById("ai_loan_id").value;
    show("explanation-result", "<p>Thinking...</p>");
    api(`/api/ai/loans/${loanId}/${kind}`)
        .then((result) => result.ok
            ? show("explanation-result", `<pre>${result.body.explanation}</pre>`)
            : show("explanation-result", `<p>Error: ${result.body.error || result.status}</p>`))
        .catch((error) => show("explanation-result", errorBox(error)));
}

document.getElementById("explain-eligibility-btn").addEventListener("click", () => explain("explain-eligibility"));
document.getElementById("explain-decision-btn").addEventListener("click", () => explain("explain-decision"));
document.getElementById("explain-repayments-btn").addEventListener("click", () => explain("explain-repayments"));

document.getElementById("compare-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {};
    if (document.getElementById("cmp_loan_id").value) payload.loan_id = document.getElementById("cmp_loan_id").value;
    if (document.getElementById("cmp_amount").value) payload.amount = document.getElementById("cmp_amount").value;
    if (document.getElementById("cmp_rate").value) payload.interest_rate = document.getElementById("cmp_rate").value;
    if (document.getElementById("cmp_income").value) payload.monthly_income = document.getElementById("cmp_income").value;
    if (document.getElementById("cmp_terms").value) {
        payload.terms = document.getElementById("cmp_terms").value.split(",").map((t) => t.trim()).filter(Boolean);
    }

    show("compare-result", "<p>Comparing options...</p>");
    try {
        const result = await api("/api/ai/repayment-options", { method: "POST", body: JSON.stringify(payload) });
        if (!result.ok) return show("compare-result", `<p>Error: ${result.body.error || result.status}</p>`);
        const rows = result.body.options.map((o) => `
            <tr><td>${o.term_months} mo</td><td>$${Number(o.monthly_payment).toFixed(2)}</td>
            <td>$${Number(o.total_interest).toLocaleString(undefined, { maximumFractionDigits: 2 })}</td>
            <td>${o.payment_share_of_income != null ? o.payment_share_of_income + "%" : "-"}</td></tr>`).join("");
        show("compare-result",
            `<table><tr><th>Term</th><th>Monthly</th><th>Total Interest</th><th>% of Income</th></tr>${rows}</table>
             <p><b>AI Recommendation:</b></p><pre>${result.body.recommendation}</pre>`);
    } catch (error) { show("compare-result", errorBox(error)); }
});
</script>
</body>
</html>
