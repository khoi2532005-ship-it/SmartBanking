name: student-4-budgets-ci

# Student 4 - Cong Bao Nguyen - Budgeting & Spending Insights
# Builds and validates the budgets frontend, backend/API and database
# microservices. Validation only: nothing is deployed.

on:
  push:
    branches: [main]
    paths:
      - 'services/budgeting/**'
      - 'prompts/budgeting/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4.yml'
      - 'mcp_server/**'
      - 'rag_server/**'
      - 'prompts/_rag/**'
      - 'prompts/_mcp/**'
      - 'prompts/_multi_agent/**'
      - 'multi_agent_server/**'
      - 'requirements-multi-agent.txt'
      - 'agentic/**'
      - 'tests/**'
      - 'requirements-mcp.txt'
      - 'requirements-rag.txt'
  pull_request:
    branches: [main]
    paths:
      - 'services/budgeting/**'
      - 'prompts/budgeting/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4.yml'
      - 'mcp_server/**'
      - 'rag_server/**'
      - 'prompts/_rag/**'
      - 'prompts/_mcp/**'
      - 'prompts/_multi_agent/**'
      - 'multi_agent_server/**'
      - 'requirements-multi-agent.txt'
      - 'agentic/**'
      - 'tests/**'
      - 'requirements-mcp.txt'
      - 'requirements-rag.txt'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml
  # Only this feature's services are built and started (--no-deps), so a
  # teammate's broken image cannot turn this workflow red.
  SERVICES: budgeting-database-service budgeting-service budgeting-frontend-service

jobs:

  # =====================================================================
  # 1. Build gate - every service image must build
  # =====================================================================
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Build all budgets service images
        run: docker compose -f "$COMPOSE_FILE" build $SERVICES

  # =====================================================================
  # 2. Unit gate - budget-versus-actual maths, plus MCP/RAG pure functions
  # =====================================================================
  unit-checks:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The budgeting contract test runs the shared Multi-Agent Server app in
      # process, so the shared servers' requirements are installed up front.
      - name: Install dependencies
        run: pip install -r services/budgeting/backend/requirements.txt -r requirements-agentic.txt -r requirements-mcp.txt -r requirements-multi-agent.txt

      - name: Seed the database
        run: python services/budgeting/database/init_db.py

      - name: Run budget logic checks
        working-directory: services/budgeting/backend
        run: python -m tests.test_budget_logic

      # MCP and RAG stay disabled in CI: these checks prove the disabled and
      # unreachable paths behave, without any shared server running.
      - name: Run MCP/RAG client and route checks (integrations disabled)
        working-directory: services/budgeting/backend
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: |
          python -m tests.test_agent_clients
          python -m tests.test_multi_agent_client
          python -m tests.test_multi_agent_contract
          python -m tests.test_budget_routes

      # Pure-function tests for the shared MCP and RAG servers. They need no
      # running server, no ChromaDB and no API key: MCP and RAG stay disabled
      # in CI, only their maths and contracts are checked.
      - name: Run shared MCP and RAG unit tests
        run: python -m pytest tests/test_mcp_server.py tests/test_rag_server.py tests/test_agentic_validation_modes.py tests/test_budgeting_mode.py tests/test_multi_agent_server.py -q

  # =====================================================================
  # 3. Runtime gate - the stack starts and every endpoint returns HTTP 200
  # =====================================================================
  smoke-check:
    name: Smoke check and endpoint tests
    runs-on: ubuntu-latest
    needs: [build-images, unit-checks]
    timeout-minutes: 15
    # docker-compose.yml reads these when it interpolates the budgeting-service
    # environment, so the containers start with MCP and RAG disabled in CI.
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Start the budgets stack
        run: docker compose -f "$COMPOSE_FILE" up -d --no-deps $SERVICES

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/8 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 8 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5014/"
          probe "backend-api"      "http://localhost:5004/api/health"
          probe "frontend"         "http://localhost:3004/tabs/budgets.html"
          probe "frontend-ai-mode" "http://localhost:3004/tabs/ai-mode.html"
          probe "budget-crud"      "http://localhost:5004/api/budgets"
          # The seed is a fixed demo period (September 2026); the current month may
          # legitimately have no budgets, so the summary checks name the period.
          probe "budget-summary"   "http://localhost:5004/api/budgets/summary?customer_id=1&month=9&year=2026"
          probe "budget-summary-now" "http://localhost:5004/api/budgets/summary?customer_id=1"
          probe "htmx-fragment"    "http://localhost:5004/ui/budgets?customer_id=1"
          # Release 1 panel fragments answer 200 even with MCP/RAG disabled
          probe "htmx-mcp-status"  "http://localhost:5004/ui/mcp/status"
          probe "htmx-mcp-tools"   "http://localhost:5004/ui/mcp/tools"
          probe "htmx-rag-status"  "http://localhost:5004/ui/rag/status"
          # Release 2 panel fragment answers 200 with the Multi-Agent Server disabled
          probe "htmx-multi-agent-status" "http://localhost:5004/ui/multi-agent/status"
          probe "htmx-multi-agent-history" "http://localhost:5004/ui/multi-agent/history"

      - name: Verify seeded records and budget calculations
        run: |
          budgets=$(curl -s http://localhost:5004/api/budgets | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "budgets in database: $budgets"
          if [ "$budgets" -lt 10 ]; then
            echo "FAIL expected at least 10 seeded budgets, found $budgets"
            exit 1
          fi

          curl -s "http://localhost:5004/api/budgets/summary?customer_id=1&month=9&year=2026" \
            | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          assert s["budgets"], "summary returned no budgets for the seeded period 09/2026"
          assert (s["month"], s["year"]) == (9, 2026), (s["month"], s["year"])
          for line in s["budgets"]:
              assert line["status"] in ("OVER_BUDGET", "NEAR_LIMIT", "ON_TRACK"), line
          print("summary OK:", s["totals"])
          print("spending source:", s["spending_source"])'

      - name: Verify MCP and RAG are configured but disabled in CI
        run: |
          curl -s http://localhost:5004/api/health | python3 -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["mcp"]["enabled"] is False, h["mcp"]
          assert h["rag"]["enabled"] is False, h["rag"]
          assert h["mcp"]["url"].startswith("http://host.docker.internal:8100"), h["mcp"]
          assert h["rag"]["url"].startswith("http://host.docker.internal:8200"), h["rag"]
          assert h["multi_agent"]["enabled"] is False, h["multi_agent"]
          assert h["multi_agent"]["url"].startswith("http://host.docker.internal:8300"), h["multi_agent"]
          print("mcp:", h["mcp"]); print("rag:", h["rag"])'

          # The panel status lines render the inactive state, never a broken swap
          curl -s http://localhost:5004/ui/mcp/status | grep -q "Inactive" \
            || { echo "FAIL /ui/mcp/status did not report the inactive state"; exit 1; }
          curl -s http://localhost:5004/ui/rag/status | grep -q "Inactive" \
            || { echo "FAIL /ui/rag/status did not report the inactive state"; exit 1; }
          curl -s http://localhost:5004/ui/multi-agent/status | grep -q "Inactive" \
            || { echo "FAIL /ui/multi-agent/status did not report the inactive state"; exit 1; }

          # The AI Mode tab carries the Release 1 and Release 2 panels; the Normal tab links to it
          curl -s http://localhost:3004/tabs/budgets.html | grep -qF 'href="/tabs/ai-mode.html"' \
            || { echo "FAIL budgets.html lacks the AI Mode tab link"; exit 1; }
          page=$(curl -s http://localhost:3004/tabs/ai-mode.html)
          for needle in 'hx-post="/ui/mcp/tool"' 'hx-get="/ui/mcp/tools"' 'hx-post="/ui/rag/query"' 'hx-post="/ui/multi-agent/workflows"' 'id="ma-history"'; do
            printf '%s' "$page" | grep -qF "$needle" \
              || { echo "FAIL frontend tab lacks $needle"; exit 1; }
          done
          echo "panels present in the frontend; status fragments report the inactive state"

      # Post-commit endpoint tests (Release 2): two endpoint functions of this
      # backend, as black-box HTTP calls against the stack started above, the
      # way a deployed service is tested. The report goes to the job summary
      # and to the student-4-endpoint-tests artifact.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the endpoint test runner
        run: pip install pytest requests

      - name: Post-commit endpoint tests (GET /api/budgets/summary, POST /api/budgets)
        env:
          BUDGET_API_URL: http://localhost:5004
          ENDPOINT_REPORT_DIR: reports
          # On a pull request GITHUB_SHA is the merge commit; record the pushed head instead.
          ENDPOINT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ENDPOINT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python -m pytest services/budgeting/backend/tests/test_endpoints_post_commit.py \
            -q -p no:cacheprovider --junitxml=reports/endpoint-tests-junit.xml

      - name: Endpoint test report to the job summary
        if: always()
        run: cat reports/post-commit-endpoint-report-student-4.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no endpoint report was written" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-4-endpoint-tests
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 4. Evidence gate - run-linked report for the technical report
  # =====================================================================
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-4-budgets-ci",
            "student": "Student 4 - Cong Bao Nguyen",
            "feature": "Budgeting & Spending Insights",
            "services": ["budgeting-frontend-service", "budgeting-service", "budgeting-database-service"],
            "ports": [3004, 5004, 5014],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "build": "passed",
              "unit": "passed",
              "smoke": "passed",
              "endpoint_tests": "passed"
            },
            "endpoint_tests_artifact": "student-4-endpoint-tests"
          }
          JSON

          cat > reports/report.md <<MD
          # Student 4 CI Report - Budgeting & Spending Insights

          | Field | Value |
          |---|---|
          | Workflow | student-4-budgets-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Build: three service images built successfully
          - Unit: budget-versus-actual calculations verified
          - Smoke: ports 5014, 5004 and 3004 returned HTTP 200
          - Endpoint tests: \`GET /api/budgets/summary\` and \`POST /api/budgets\` passed against the
            containerised stack after this push, in the smoke job (artifact \`student-4-endpoint-tests\`,
            report \`post-commit-endpoint-report-student-4.{json,md}\`)
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | budgeting-database-service | \`GET http://localhost:5014/\` |
          | budgeting-service | \`GET http://localhost:5004/api/health\` |
          | budgeting-service | \`GET http://localhost:5004/api/budgets\` |
          | budgeting-service | \`GET http://localhost:5004/api/budgets/summary?customer_id=1&month=9&year=2026\` (seeded period) |
          | budgeting-service | \`GET http://localhost:5004/ui/mcp/status\`, \`GET http://localhost:5004/ui/rag/status\` (inactive in CI) |
          | budgeting-service | \`GET http://localhost:5004/ui/multi-agent/status\` (inactive in CI: MULTI_AGENT_ENABLED=false) |

          ## Release 2 surface (unit-tested, disabled in the smoke stack)

          \`POST /api/multi-agent/workflows\` (start), \`GET /api/multi-agent/workflows\` (history),
          \`GET /api/multi-agent/workflows/<id>\` (the whole workflow), \`POST .../decision\` (Accept / Partially accept / Reject);
          settings MULTI_AGENT_ENABLED, MULTI_AGENT_SERVER_URL, MULTI_AGENT_API_TOKEN, BUDGET_FRONTEND_ORIGINS.
          | budgeting-frontend-service | \`GET http://localhost:3004/tabs/budgets.html\` |
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-4-report
          path: reports/
          retention-days: 30
