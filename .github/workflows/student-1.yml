name: student-1-accounts-ci

on:
  push:
    branches: [main]
    paths:
      - 'services/accounts/**'
      - 'prompts/accounts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/accounts/**'
      - 'prompts/accounts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml
  SERVICE: accounts

jobs:
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Build the accounts service image
        run: docker compose -f "$COMPOSE_FILE" build $SERVICE

  unit-checks:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run account-logic checks
        working-directory: services/accounts/backend
        run: python -m tests.test_account_logic -v

  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: [build-images, unit-checks]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the accounts service
        run: docker compose -f "$COMPOSE_FILE" up -d --no-deps $SERVICE

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/10 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 10 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5011/"
          probe "backend-api"      "http://localhost:5001/api/health"
          probe "frontend"         "http://localhost:3001/"
          probe "customers-crud"   "http://localhost:5001/api/customers"
          probe "accounts-crud"    "http://localhost:5001/api/accounts"

      - name: Verify seeded records
        run: |
          customers=$(curl -s http://localhost:5001/api/customers | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          accounts=$(curl -s http://localhost:5001/api/accounts | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "customers in database: $customers"
          echo "accounts in database: $accounts"
          if [ "$customers" -lt 8 ]; then
            echo "FAIL expected at least 8 seeded customers, found $customers"
            exit 1
          fi
          if [ "$accounts" -lt 11 ]; then
            echo "FAIL expected at least 11 seeded accounts, found $accounts"
            exit 1
          fi

      - name: NFR check - >=19/20 requests to /api/customers under 500ms
        run: |
          set -e
          pass=0
          total=20
          for i in $(seq 1 "$total"); do
            secs=$(curl -s -o /dev/null -w "%{time_total}" http://localhost:5001/api/customers)
            ms=$(awk -v s="$secs" 'BEGIN { printf "%d", s * 1000 }')
            echo "request $i: ${ms}ms"
            if [ "$ms" -le 500 ]; then pass=$((pass + 1)); fi
          done
          echo "under_500ms=$pass/$total"
          if [ "$pass" -lt 19 ]; then
            echo "FAIL NFR: only $pass/$total requests were <=500ms"
            exit 1
          fi
          echo "PASS NFR: $pass/$total requests were <=500ms"

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-1-accounts-ci",
            "student": "Student 1 - William Por",
            "feature": "Accounts & Customers",
            "services": ["accounts"],
            "ports": [3001, 5001, 5011],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "build": "passed",
              "unit": "passed",
              "smoke": "passed",
              "nfr": "passed (>=19/20 requests to /api/customers <=500ms)"
            }
          }
          JSON

          cat > reports/report.md <<MD
          # Student 1 CI Report - Accounts & Customers

          | Field | Value |
          |---|---|
          | Workflow | student-1-accounts-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Build: the accounts service image built successfully
          - Unit: services/account_logic.py risk/summary checks verified (10 checks, no Docker or API key required)
          - Smoke: ports 5011, 5001 and 3001 returned HTTP 200; at least 8 customers and 11 accounts were seeded
          - NFR: >=19/20 requests to /api/customers responded within 500ms
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | database-service | \`GET http://localhost:5011/\` |
          | backend/API | \`GET http://localhost:5001/api/health\` |
          | backend/API | \`GET http://localhost:5001/api/customers\` |
          | backend/API | \`GET http://localhost:5001/api/accounts\` |
          | frontend-static | \`GET http://localhost:3001/\` |

          AI-Mode endpoints (\`/api/ai/customers/<id>/summary\`, \`/risk-profile\`, \`/history\`) are out of
          scope for this pipeline - they require a live LLM_PROVIDER and are checked manually during the demo.
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-1-report
          path: reports/
          retention-days: 30
