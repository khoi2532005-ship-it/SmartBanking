name: student-3-fraud-ci

on:
  push:
    branches: [main]
    paths:
      - 'services/fraud-alerts/**'
      - 'prompts/fraud-alerts/**'
      - 'prompts/_loop/**'
      - 'agentic/**'
      - 'agentic_loop.py'
      - 'tests/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/fraud-alerts/**'
      - 'prompts/fraud-alerts/**'
      - 'prompts/_loop/**'
      - 'agentic/**'
      - 'agentic_loop.py'
      - 'tests/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml

jobs:

  # =====================================================================
  # 1. Config gate - the compose definition is valid and images resolve
  #
  # Fraud has no Dockerfiles yet: its three services run from stock
  # python/nginx images over bind mounts (see the header of
  # docker-compose.yml). There is nothing to `docker compose build`, so this
  # gate validates the definition and pre-pulls instead. Turn it into a real
  # build gate once the Dockerfiles land.
  # =====================================================================
  compose-validation:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Validate the compose definition
        run: docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Pre-pull fraud service images
        run: |
          docker compose -f "$COMPOSE_FILE" pull --quiet \
            fraud-database-service fraud-service fraud-frontend-service

  # =====================================================================
  # 2. Unit gate - the shared agentic loop engine
  #
  # These stub the LLM and start no services, so they need no API key and
  # run on every push. test_adapt_retries_and_recovers is the one that
  # proves the loop actually loops.
  #
  # TODO: fraud rule-engine tests belong in services/fraud-alerts/tests/
  # (currently empty). Add them here as a second step once written.
  # =====================================================================
  unit-checks:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-agentic.txt

      - name: Run agentic loop engine tests
        run: python -m pytest tests/ -q

      - name: Verify every prompt file the loop loads is non-empty
        run: |
          missing=0
          for f in \
            prompts/_loop/review_system_prompt.txt \
            prompts/_loop/review_task_prompt.txt \
            prompts/fraud-alerts/implementation/system_prompt.txt \
            prompts/fraud-alerts/implementation/context_prompt.txt \
            prompts/fraud-alerts/implementation/task_prompt.txt
          do
            if [ ! -s "$f" ]; then
              echo "FAIL missing or empty prompt: $f"
              missing=1
            else
              echo "PASS $f ($(wc -c < "$f") bytes)"
            fi
          done
          exit $missing

  # =====================================================================
  # 3. Runtime gate - the stack starts and every endpoint returns HTTP 200
  # =====================================================================
  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: [compose-validation, unit-checks]
    timeout-minutes: 15
    # Promoted to job level so the agentic-loop step's `if:` can test it -
    # a step's own `env:` block is not visible to that step's `if:`.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start the fraud stack
        # fraud-service depends_on accounts and transactions (service_started),
        # so compose pulls those in too. No API key is needed: the compose
        # anchor defaults GEMINI_API_KEY to empty and none of the probed
        # endpoints call the LLM.
        run: |
          docker compose -f "$COMPOSE_FILE" up -d \
            fraud-database-service fraud-service fraud-frontend-service

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/8 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 8 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5013/"
          probe "backend-health"   "http://localhost:5003/api/health"
          probe "rules-crud"       "http://localhost:5003/api/rules"
          probe "alerts-crud"      "http://localhost:5003/api/alerts"
          probe "frontend-normal"  "http://localhost:3003/tabs/normal.html"
          probe "frontend-ai-mode" "http://localhost:3003/tabs/ai-mode.html"

      - name: Verify seeded records
        # Deliverable: 10+ records in every table this feature owns.
        run: |
          count() { curl -s "$1" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))'; }

          rules=$(count http://localhost:5003/api/rules)
          alerts=$(count http://localhost:5003/api/alerts)
          echo "alert_rules rows: $rules"
          echo "alerts rows: $alerts"

          fail=0
          [ "$rules"  -ge 10 ] || { echo "FAIL expected >=10 rules, found $rules";   fail=1; }
          [ "$alerts" -ge 10 ] || { echo "FAIL expected >=10 alerts, found $alerts"; fail=1; }
          exit $fail

      - name: Verify rule types and alert shape
        run: |
          curl -s http://localhost:5003/api/rules | python3 -c '
          import json, sys
          rules = json.load(sys.stdin)
          types = {r["rule_type"] for r in rules}
          expected = {"amount_over", "velocity", "unusual_time", "new_recipient_high_value"}
          missing = expected - types
          assert not missing, f"rule types not seeded: {sorted(missing)}"
          print("rule types OK:", sorted(types))'

          curl -s http://localhost:5003/api/alerts | python3 -c '
          import json, sys
          alerts = json.load(sys.stdin)
          required = {"alert_id", "rule_id", "customer_id", "transaction_amount", "severity"}
          for a in alerts:
              missing = required - set(a)
              assert not missing, "alert " + str(a.get("alert_id")) + " missing " + str(sorted(missing))
          print("alert shape OK across " + str(len(alerts)) + " alerts")'

      - name: Agentic loop end-to-end (evidence, non-blocking)
        # Needs a real model, so it runs only when the secret is configured.
        #
        # continue-on-error is deliberate. The loop's pass/fail depends on what
        # the model wrote, which is not a property of this commit: a vague
        # answer that fails validate() twice would block a perfectly good PR.
        # The deterministic proof that the loop works is `pytest tests/` in the
        # unit gate; this step exists to produce release evidence against a
        # live model, so it reports without gating.
        if: ${{ env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        env:
          FRAUD_SERVICE_URL: http://localhost:5003
        run: |
          pip install -r requirements-agentic.txt
          python agentic_loop.py --mode fraud

      - name: Upload agentic loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-loop-evidence
          path: docs/evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 4. Evidence gate - run-linked report for the technical report
  # =====================================================================
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-3-fraud-ci",
            "student": "Student 3 - Duc Minh Khoi Tran",
            "feature": "Fraud Alerts / Notifications",
            "services": ["fraud-frontend-service", "fraud-service", "fraud-database-service"],
            "ports": [3003, 5003, 5013],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "compose": "passed",
              "unit": "passed",
              "smoke": "passed"
            }
          }
          JSON

          cat > reports/report.md <<MD
          # Student 3 CI Report - Fraud Alerts / Notifications

          | Field | Value |
          |---|---|
          | Workflow | student-3-fraud-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Compose: definition validated, three service images resolved
          - Unit: agentic loop engine tests passed; loop prompt files non-empty
          - Smoke: ports 5013, 5003 and 3003 returned HTTP 200
          - Seed: alert_rules and alerts each hold 10+ records
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | fraud-database-service | \`GET http://localhost:5013/\` |
          | fraud-service | \`GET http://localhost:5003/api/health\` |
          | fraud-service | \`GET http://localhost:5003/api/rules\` |
          | fraud-service | \`GET http://localhost:5003/api/alerts\` |
          | fraud-frontend-service | \`GET http://localhost:3003/tabs/normal.html\` |
          | fraud-frontend-service | \`GET http://localhost:3003/tabs/ai-mode.html\` |

          ## Agentic loop

          Plan -> Act -> Observe -> Adapt -> Review, run against the live
          service by \`python agentic_loop.py --mode fraud\`. Per-run evidence
          is attached to this workflow run as \`student-3-loop-evidence\`.
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-3-report
          path: reports/
          retention-days: 30
