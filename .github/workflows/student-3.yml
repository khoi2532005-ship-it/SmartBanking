name: student-3-fraud-ci

on:
  push:
    branches: [main]
    paths:
      - 'services/fraud-alerts/**'
      - 'prompts/fraud-alerts/**'
      - 'prompts/_loop/**'
      - 'agentic/**'
      - 'agentic_loop.py'
      - 'tests/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
      - 'multi_agent_server/**'
      - 'prompts/_multi_agent/**'
      - 'requirements-multi-agent.txt'
  pull_request:
    branches: [main]
    paths:
      - 'services/fraud-alerts/**'
      - 'prompts/fraud-alerts/**'
      - 'prompts/_loop/**'
      - 'agentic/**'
      - 'agentic_loop.py'
      - 'tests/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
      - 'multi_agent_server/**'
      - 'prompts/_multi_agent/**'
      - 'requirements-multi-agent.txt'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml
  SERVICES: fraud-database-service fraud-service fraud-frontend-service

jobs:

  # =====================================================================
  # 1. Build gate - every fraud image must build from its own Dockerfile
  #
  # Spec 6.3 requires the frontend, backend and database to be containerised,
  # so this gate compiles all three images with the repository root as build
  # context. Unlike a `config` + `pull` check it fails on a broken Dockerfile,
  # an unresolvable pin in requirements.txt, or a database that will not seed -
  # `RUN python init_db.py` executes here.
  # =====================================================================
  build-images:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Validate the compose definition
        run: docker compose -f "$COMPOSE_FILE" config --quiet

      - name: Build the fraud service images
        run: docker compose -f "$COMPOSE_FILE" build $SERVICES

  # =====================================================================
  # 2. Unit gate - the shared agentic loop engine
  #
  # These stub the LLM and start no services, so they need no API key and
  # run on every push. test_adapt_retries_and_recovers is the one that
  # proves the loop actually loops.
  # =====================================================================
  unit-checks:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requirements-mcp.txt: the MCP server tests in tests/ need the mcp SDK
        run: pip install -r requirements-agentic.txt -r requirements-mcp.txt

      - name: Run agentic loop engine tests
        run: |
          python -m pytest \
            tests/test_agentic_loop.py \
            tests/test_agentic_validation_modes.py \
            -q

      - name: Install the fraud backend's dependencies
        # Only after the engine tests. With Flask installed, the loans and
        # transactions backend tests in tests/ stop skipping, and their two
        # `app` modules clash in one process. The fraud unit tests import the
        # backend itself and run the shared Multi-Agent Server in process.
        run: pip install -r requirements-multi-agent.txt -r services/fraud-alerts/backend/requirements.txt

      - name: Run fraud backend unit tests
        # Release 2: the Multi-Agent client and routes (against the real
        # server app, in process), the AI-Mode switch and the CORS rule. No
        # service, no network, no API key.
        working-directory: services/fraud-alerts/backend
        run: python -m pytest tests/unit -q --junitxml=reports/student-3-unit-tests.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-unit-tests
          path: services/fraud-alerts/backend/reports/student-3-unit-tests.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify every prompt file the loop loads is non-empty
        run: |
          missing=0
          for f in \
            prompts/_loop/review_system_prompt.txt \
            prompts/_loop/review_task_prompt.txt \
            prompts/fraud-alerts/implementation/system_prompt.txt \
            prompts/fraud-alerts/implementation/context_prompt.txt \
            prompts/fraud-alerts/implementation/task_prompt.txt
          do
            if [ ! -s "$f" ]; then
              echo "FAIL missing or empty prompt: $f"
              missing=1
            else
              echo "PASS $f ($(wc -c < "$f") bytes)"
            fi
          done
          exit $missing

  # =====================================================================
  # 3. Runtime gate - the stack starts and every endpoint returns HTTP 200
  # =====================================================================
  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: [build-images, unit-checks]
    timeout-minutes: 15
    # Promoted to job level so the agentic-loop step's `if:` can test it -
    # a step's own `env:` block is not visible to that step's `if:`.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Every AI integration stays in the image but is switched off in CI,
      # where no LLM, MCP, RAG or Multi-Agent server runs for the app. The
      # compose anchor reads these. GEMINI_API_KEY above feeds only the
      # host-side, non-blocking agentic-loop step, not the app's AI-Mode.
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Start the fraud stack (every AI integration switched off)
        # fraud-service depends_on accounts and transactions (service_started),
        # so compose pulls those in too. The flags come from the job env
        # through the compose anchor.
        run: docker compose -f "$COMPOSE_FILE" up -d fraud-database-service fraud-service fraud-frontend-service

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/8 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 8 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5013/"
          probe "backend-health"   "http://localhost:5003/api/health"
          probe "rules-crud"       "http://localhost:5003/api/rules"
          probe "alerts-crud"      "http://localhost:5003/api/alerts"
          probe "frontend-normal"  "http://localhost:3003/tabs/normal.html"
          probe "frontend-ai-mode" "http://localhost:3003/tabs/ai-mode.html"

      - name: Verify every AI integration is retained but switched off
        # Retained: the routes are in the image. Switched off: they answer
        # 503 "disabled" without calling out, and /api/health says so.
        run: |
          curl -s http://localhost:5003/api/health | python3 -c '
          import json, sys
          health = json.load(sys.stdin)
          for name in ("ai_mode", "mcp", "rag", "multi_agent"):
              assert health[name]["enabled"] is False, (name, health[name])
          print("PASS /api/health: every AI integration off:", {n: health[n] for n in ("ai_mode", "mcp", "rag", "multi_agent")})'

          disabled() {
            local method="$1" path="$2" body="${3:-}"
            local args=(-s -o "$RUNNER_TEMP/reply.json" -w '%{http_code}' -X "$method" -H 'Content-Type: application/json')
            if [ -n "$body" ]; then args+=(-d "$body"); fi
            code=$(curl "${args[@]}" "http://localhost:5003$path")
            if [ "$code" = "503" ] && python3 -c 'import json, sys; assert json.load(open(sys.argv[1])).get("disabled") is True' "$RUNNER_TEMP/reply.json"; then
              echo "PASS $method $path -> 503 disabled: $(cat "$RUNNER_TEMP/reply.json")"
            else
              echo "FAIL $method $path -> $code $(cat "$RUNNER_TEMP/reply.json")"
              return 1
            fi
          }
          disabled GET  /api/mcp/tools
          disabled POST /api/mcp/tool  '{"customer_id": 1}'
          disabled POST /api/rag/query '{"query": "How does the Fraud Alerts feature get transaction data?"}'
          disabled GET  /api/ai/alerts/1/explain
          disabled POST /api/agents/workflow '{"task": "Summarise the alerts by severity", "customer_id": 1}'
          disabled GET  /api/agents/workflows

          curl -s http://localhost:3003/tabs/ai-mode.html | grep -q 'id="ma-form"' \
            || { echo "FAIL ai-mode.html lacks the Multi-Agent panel"; exit 1; }
          echo "PASS ai-mode.html carries the Multi-Agent panel"

      - name: Verify seeded records
        # Deliverable: 10+ records in every table this feature owns.
        run: |
          count() { curl -s "$1" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))'; }

          rules=$(count http://localhost:5003/api/rules)
          alerts=$(count http://localhost:5003/api/alerts)
          echo "alert_rules rows: $rules"
          echo "alerts rows: $alerts"

          fail=0
          [ "$rules"  -ge 10 ] || { echo "FAIL expected >=10 rules, found $rules";   fail=1; }
          [ "$alerts" -ge 10 ] || { echo "FAIL expected >=10 alerts, found $alerts"; fail=1; }
          exit $fail

      - name: Verify rule types and alert shape
        run: |
          curl -s http://localhost:5003/api/rules | python3 -c '
          import json, sys
          rules = json.load(sys.stdin)
          types = {r["rule_type"] for r in rules}
          expected = {"amount_over", "velocity", "unusual_time", "new_recipient_high_value"}
          missing = expected - types
          assert not missing, f"rule types not seeded: {sorted(missing)}"
          print("rule types OK:", sorted(types))'

          curl -s http://localhost:5003/api/alerts | python3 -c '
          import json, sys
          alerts = json.load(sys.stdin)
          required = {"alert_id", "rule_id", "customer_id", "transaction_amount", "severity"}
          for a in alerts:
              missing = required - set(a)
              assert not missing, "alert " + str(a.get("alert_id")) + " missing " + str(sorted(missing))
          print("alert shape OK across " + str(len(alerts)) + " alerts")'

      - name: Agentic loop end-to-end (evidence, non-blocking)
        # Needs a real model, so it runs only when the secret is configured.
        #
        # continue-on-error is deliberate. The loop's pass/fail depends on what
        # the model wrote, which is not a property of this commit: a vague
        # answer that fails validate() twice would block a perfectly good PR.
        # The deterministic proof that the loop works is `pytest tests/` in the
        # unit gate; this step exists to produce release evidence against a
        # live model, so it reports without gating.
        if: ${{ env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        env:
          FRAUD_SERVICE_URL: http://localhost:5003
        run: |
          pip install -r requirements-agentic.txt
          python agentic_loop.py --mode fraud

      - name: Upload agentic loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-loop-evidence
          path: docs/evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 4. Endpoint gate - pytest against the running backend (Release 2)
  #
  # One read endpoint (GET /api/alerts) and one write endpoint (POST
  # /api/rules, through a full create-read-update-delete cycle), with every
  # AI integration switched off. JUnit XML and the log are uploaded for the
  # report and the agentic loop's testing_review mode.
  # =====================================================================
  endpoint-tests:
    name: Endpoint tests
    runs-on: ubuntu-latest
    needs: [build-images, unit-checks]
    timeout-minutes: 15
    env:
      AI_MODE_ENABLED: "false"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
      FRAUD_API_URL: http://localhost:5003
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Start fraud-database-service and fraud-service
        # --no-deps: neither endpoint needs Accounts or Transactions, so a
        # teammate's image cannot turn this gate red.
        run: docker compose -f "$COMPOSE_FILE" up -d --build --no-deps fraud-database-service fraud-service

      - name: Wait for the API
        run: |
          for attempt in $(seq 1 15); do
            curl -sf "$FRAUD_API_URL/api/rules" -o /dev/null && { echo "fraud-service ready (attempt $attempt)"; exit 0; }
            sleep 2
          done
          echo "FAIL fraud-service did not answer /api/rules"; exit 1

      - name: Run endpoint tests
        working-directory: services/fraud-alerts/backend
        run: |
          mkdir -p reports
          python -m pytest tests/post_commit -v --junitxml=reports/student-3-endpoint-tests.xml 2>&1 | tee reports/student-3-endpoint-tests.log
          exit "${PIPESTATUS[0]}"

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-endpoint-tests
          path: services/fraud-alerts/backend/reports/
          retention-days: 30

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100 fraud-service fraud-database-service

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 5. Evidence gate - run-linked report for the technical report
  # =====================================================================
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: [smoke-check, endpoint-tests]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-3-fraud-ci",
            "student": "Student 3 - Duc Minh Khoi Tran",
            "feature": "Fraud Alerts / Notifications",
            "services": ["fraud-frontend-service", "fraud-service", "fraud-database-service"],
            "ports": [3003, 5003, 5013],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "compose": "passed",
              "unit": "passed",
              "smoke": "passed",
              "endpoint_tests": "passed",
              "ai_integrations_disabled": "passed"
            }
          }
          JSON

          cat > reports/report.md <<MD
          # Student 3 CI Report - Fraud Alerts / Notifications

          | Field | Value |
          |---|---|
          | Workflow | student-3-fraud-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Build: three images built from their Dockerfiles; compose definition validated
          - Unit: agentic loop engine tests passed; loop prompt files non-empty;
            fraud backend unit tests passed (JUnit artifact \`student-3-unit-tests\`)
          - Smoke: ports 5013, 5003 and 3003 returned HTTP 200
          - Seed: alert_rules and alerts each hold 10+ records
          - AI integrations: AI-Mode, MCP, RAG and Multi-Agent retained but switched
            off (AI_MODE_ENABLED, MCP_ENABLED, RAG_ENABLED and MULTI_AGENT_ENABLED all
            false); /api/ai/alerts/1/explain, /api/mcp/tools, /api/mcp/tool,
            /api/rag/query, /api/agents/workflow and /api/agents/workflows answered
            503 "disabled" and /api/health reported all four off
          - Endpoint tests: pytest against the running backend - GET /api/alerts
            (read) and the POST /api/rules create-read-update-delete cycle (write);
            JUnit XML and log in the artifact \`student-3-endpoint-tests\`
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | fraud-database-service | \`GET http://localhost:5013/\` |
          | fraud-service | \`GET http://localhost:5003/api/health\` |
          | fraud-service | \`GET http://localhost:5003/api/rules\` |
          | fraud-service | \`GET http://localhost:5003/api/alerts\` |
          | fraud-service | \`POST http://localhost:5003/api/agents/workflow\` (503 disabled in CI) |
          | fraud-service | \`GET http://localhost:5003/api/agents/workflows\` (503 disabled in CI) |
          | fraud-frontend-service | \`GET http://localhost:3003/tabs/normal.html\` |
          | fraud-frontend-service | \`GET http://localhost:3003/tabs/ai-mode.html\` |

          ## Agentic loop

          Plan -> Act -> Observe -> Adapt -> Review, run against the live
          service by \`python agentic_loop.py --mode fraud\`. Per-run evidence
          is attached to this workflow run as \`student-3-loop-evidence\`.
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-3-report
          path: reports/
          retention-days: 30
