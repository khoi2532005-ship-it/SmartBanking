name: student-5-transactions-ci

# Student 5 - Aidan Lei - Transactions
# Builds and validates the transactions frontend, backend/API and database
# microservice. Validation only: nothing is deployed.

on:
  push:
    branches: [main]
    paths:
      - 'services/transactions/**'
      - 'prompts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
      - 'mcp_server/**'
      - 'rag_server/**'
      - 'prompts/_rag/**'
      - 'prompts/_mcp/**'
      - 'tests/**'
      - 'requirements-mcp.txt'
      - 'requirements-rag.txt'
  pull_request:
    branches: [main]
    paths:
      - 'services/transactions/**'
      - 'prompts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
      - 'mcp_server/**'
      - 'rag_server/**'
      - 'prompts/_rag/**'
      - 'prompts/_mcp/**'
      - 'tests/**'
      - 'requirements-mcp.txt'
      - 'requirements-rag.txt'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml
  SERVICES: transactions
  # Keep the feature code and UI in place, but disable both shared integrations
  # while the containerized CI stack is running. This still proves the routes
  # and panels render the inactive state instead of crashing.
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

jobs:

  # =====================================================================
  # 1. Build gate - transactions image must build
  # =====================================================================
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Build transactions service image
        run: docker compose -f "$COMPOSE_FILE" build $SERVICES

  # =====================================================================
  # 2. Unit gate - run the repo's MCP/RAG-focused tests for the feature
  # =====================================================================
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agentic.txt -r requirements-mcp.txt -r requirements-rag.txt

      - name: Run relevant unit tests
        run: python -m pytest -q tests/test_agentic_validation_modes.py tests/test_mcp_server.py tests/test_rag_server.py

  # =====================================================================
  # 3. Runtime gate - the stack starts and every endpoint returns HTTP 200
  # =====================================================================
  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: [build-image, unit-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the transactions stack
        run: docker compose -f "$COMPOSE_FILE" up -d --no-deps $SERVICES

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/8 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 8 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5015/"
          probe "backend-api"      "http://localhost:5005/api/health"
          probe "backend-status"   "http://localhost:5005/ui/mcp/status"
          probe "backend-rag"      "http://localhost:5005/ui/rag/status"
          probe "frontend"         "http://localhost:3005/tabs/transactions.html"
          probe "transactions-crud" "http://localhost:5005/api/transactions"

      - name: Verify seeded records
        run: |
          txs=$(curl -s http://localhost:5005/api/transactions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "transactions in database: $txs"
          if [ "$txs" -lt 10 ]; then
            echo "FAIL expected at least 10 seeded transactions, found $txs"
            exit 1
          fi

      - name: Verify MCP and RAG are configured but disabled in CI
        run: |
          curl -s http://localhost:5005/api/health | python3 -c '
          import json, sys
          h = json.load(sys.stdin)
          assert h["mcp"]["enabled"] is False, h["mcp"]
          assert h["rag"]["enabled"] is False, h["rag"]
          assert h["mcp"]["url"].startswith("http://host.docker.internal:8100"), h["mcp"]
          assert h["rag"]["url"].startswith("http://host.docker.internal:8200"), h["rag"]
          print("mcp:", h["mcp"])
          print("rag:", h["rag"])
          '

          curl -s http://localhost:5005/ui/mcp/status | grep -q "Inactive" \
            || { echo "FAIL /ui/mcp/status did not report the inactive state"; exit 1; }
          curl -s http://localhost:5005/ui/rag/status | grep -q "Inactive" \
            || { echo "FAIL /ui/rag/status did not report the inactive state"; exit 1; }

          page=$(curl -s http://localhost:3005/tabs/transactions.html)
          for needle in 'hx-post="/ui/mcp/tool"' 'hx-get="/ui/mcp/tools"' 'hx-post="/ui/rag/query"'; do
            printf '%s' "$page" | grep -qF "$needle" \
              || { echo "FAIL frontend tab lacks $needle"; exit 1; }
          done
          echo "panels present in the frontend; status fragments report the inactive state"

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 4. Evidence gate - run-linked report for the technical report
  # =====================================================================
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-5-transactions-ci",
            "student": "Student 5 - Aidan Lei",
            "feature": "Transactions",
            "services": ["transactions"],
            "ports": [3005, 5005, 5015],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "build": "passed",
              "smoke": "passed"
            }
          }
          JSON

          cat > reports/report.md <<MD
          # Student 5 CI Report - Transactions

          | Field | Value |
          |---|---|
          | Workflow | student-5-transactions-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Build: transactions service image built successfully
          - Smoke: ports 5015, 5005 and 3005 returned HTTP 200
          - MCP/RAG: integrations retained in the feature but disabled in CI (MCP_ENABLED=false, RAG_ENABLED=false)
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | transactions | \`GET http://localhost:5015/\` |
          | transactions | \`GET http://localhost:5005/api/health\` |
          | transactions | \`GET http://localhost:5005/ui/mcp/status\`, \`GET http://localhost:5005/ui/rag/status\` (inactive in CI) |
          | transactions | \`GET http://localhost:5005/api/transactions\` |
          | transactions | \`GET http://localhost:3005/tabs/transactions.html\` |
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-5-report
          path: reports/
          retention-days: 30
