name: student-5-transactions-ci

# Student 5 - Aidan Lei - Transactions
# Builds and validates the transactions frontend, backend/API and database
# microservice. Validation only: nothing is deployed.

on:
  push:
    branches: [main]
    paths:
      - 'services/transactions/**'
      - 'prompts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/transactions/**'
      - 'prompts/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml

jobs:

  # =====================================================================
  # 1. Build gate - transactions image must build
  # =====================================================================
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Build transactions service image
        run: docker compose -f "$COMPOSE_FILE" build transactions

  # =====================================================================
  # 2. Runtime gate - the stack starts and every endpoint returns HTTP 200
  # =====================================================================
  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    needs: [build-image]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the transactions stack
        run: docker compose -f "$COMPOSE_FILE" up -d transactions

      - name: Probe required endpoints
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --connect-timeout 5 --max-time 20 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "PASS $name -> $url ($code) on attempt $attempt"
                return 0
              fi
              echo "  ... $name attempt $attempt/8 got $code"
              sleep 2
            done
            echo "FAIL $name -> $url after 8 attempts"
            return 1
          }

          probe "database-service" "http://localhost:5015/"
          probe "backend-api"      "http://localhost:5005/api/health"
          probe "frontend"         "http://localhost:3005/tabs/transactions.html"
          probe "transactions-crud" "http://localhost:5005/api/transactions"

      - name: Verify seeded records
        run: |
          txs=$(curl -s http://localhost:5005/api/transactions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "transactions in database: $txs"
          if [ "$txs" -lt 10 ]; then
            echo "FAIL expected at least 10 seeded transactions, found $txs"
            exit 1
          fi

      - name: Container status
        if: always()
        run: docker compose -f "$COMPOSE_FILE" ps

      - name: Service logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs --tail 100

      - name: Stop services
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v

  # =====================================================================
  # 3. Evidence gate - run-linked report for the technical report
  # =====================================================================
  evidence-pack:
    name: Evidence pack
    runs-on: ubuntu-latest
    needs: smoke-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: |
          mkdir -p reports
          cat > reports/report.json <<JSON
          {
            "workflow_name": "student-5-transactions-ci",
            "student": "Student 5 - Aidan Lei",
            "feature": "Transactions",
            "services": ["transactions"],
            "ports": [3005, 5005, 5015],
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "branch": "${GITHUB_REF_NAME}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gates": {
              "build": "passed",
              "smoke": "passed"
            }
          }
          JSON

          cat > reports/report.md <<MD
          # Student 5 CI Report - Transactions

          | Field | Value |
          |---|---|
          | Workflow | student-5-transactions-ci |
          | Commit | \`${GITHUB_SHA}\` |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Run ID | \`${GITHUB_RUN_ID}\` |
          | Generated (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Gates

          - Build: transactions service image built successfully
          - Smoke: ports 5015, 5005 and 3005 returned HTTP 200
          - Teardown: \`docker compose down -v\` ran

          ## Validated endpoints

          | Service | Endpoint |
          |---|---|
          | transactions | \`GET http://localhost:5015/\` |
          | transactions | \`GET http://localhost:5005/api/health\` |
          | transactions | \`GET http://localhost:5005/api/transactions\` |
          | transactions | \`GET http://localhost:3005/tabs/transactions.html\` |
          MD

          echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > reports/run-view.md

      - uses: actions/upload-artifact@v4
        with:
          name: student-5-report
          path: reports/
          retention-days: 30
