name: student-2-loans-ci

on:
  push:
    branches: [main]
    paths:
      - 'services/loans/**'
      - 'prompts/loans/**'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-2.yml'
  pull_request:
    branches: [main]
    paths:
    - 'services/loans/**'
    - 'prompts/loans/**'
    - 'shared/frontend/**'
    - 'docker-compose.yml'
    - '.github/workflows/student-2.yml'
  workflow_dispatch:
    
jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

      - name: Build services
        run: docker-compose build
      
  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose
        run: |
          docker-compose --version || (sudo apt-get update && sudo apt-get install -y docker-compose)

      - name: Start services
        run: docker-compose up -d

      - name: Smoke checks
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PASS $url -> $code"
                return 0
              fi

              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL $url after $attempts attempts"
            return 1
          }

          check_url "http://localhost:3002/"
          check_url "http://localhost:5002/"
          check_url "http://localhost:5012/"

      - name: Stop services
        if: always()
        run: docker-compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"

      - name: Generate report.json
        run: |
          cat > "$GITHUB_WORKSPACE/reports/report.json" << EOF
          {
            "workflow_name": "lab5-ci",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "generated_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Generate report.md
        run: |
          cat > "$GITHUB_WORKSPACE/reports/report.md" << EOF
          ## Lab 05 Workflow Report

          - Workflow: lab5-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          EOF

      - name: Generate run-view.md
        run: |
          cat > "$GITHUB_WORKSPACE/reports/run-view.md" << EOF
          Run URL:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Verify files exist
        run: |
          echo "================================"
          echo "GITHUB_WORKSPACE:"
          echo "$GITHUB_WORKSPACE"
          echo "================================"

          echo "REPORTS DIRECTORY:"
          ls -lah "$GITHUB_WORKSPACE/reports"

          echo "================================"
          echo "FILES:"
          find "$GITHUB_WORKSPACE/reports" -type f -print

          echo "================================"
          echo "REPORT.JSON:"
          cat "$GITHUB_WORKSPACE/reports/report.json"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-2-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: error